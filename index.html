
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Spider Web</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #10131c;
      color: white;
      overflow-x: hidden;
    }

    /* Spider web background */
    #webCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    /* Website content stays usable */
    .content {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 4rem);
      color: #00e5ff;
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
      max-width: 600px;
      margin-bottom: 25px;
    }

    .btn {
      padding: 13px 24px;
      border: none;
      border-radius: 8px;
      background: #00e5ff;
      color: #10131c;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      background: white;
    }

    #restore {
      position: fixed;
      z-index: 20;
      top: 20px;
      right: 20px;
    }

    .hint {
      position: fixed;
      z-index: 20;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: 90%;
      color: #b8c5d9;
      font-size: 13px;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <canvas id="webCanvas"></canvas>

  <button class="btn" id="restore">Restore Web</button>

  <main class="content">
    <h1>Spider Web Experience</h1>

    <p>
      Move your mouse around the screen to remove the spider web.
      Discover the website underneath and enjoy this interactive
      background effect.
    </p>

    <button class="btn" onclick="alert('Welcome to my website!')">
      Explore Website
    </button>
  </main>

  <div class="hint">
    Move your mouse or finger to clear the web
  </div>

  <script>
    const canvas = document.getElementById("webCanvas");
    const ctx = canvas.getContext("2d");
    const restoreButton = document.getElementById("restore");

    let width;
    let height;
    let spacing = 35;
    let mouseDown = false;
    let lastPoint = null;

    // Set canvas size to match the screen
    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;

      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      drawWeb();
    }

    // Draw the spider web
    function drawWeb() {
      ctx.globalCompositeOperation = "source-over";
      ctx.clearRect(0, 0, width, height);

      const centerX = width / 2;
      const centerY = height / 2;
      const maxRadius = Math.hypot(width, height);

      ctx.strokeStyle = "rgba(180, 210, 255, 0.65)";
      ctx.lineWidth = 0.8;

      // Radial web threads
      const rayCount = 32;

      for (let i = 0; i < rayCount; i++) {
        const angle = (Math.PI * 2 * i) / rayCount;

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);

        ctx.lineTo(
          centerX + Math.cos(angle) * maxRadius,
          centerY + Math.sin(angle) * maxRadius
        );

        ctx.stroke();
      }

      // Curved circular web threads
      for (
        let radius = spacing;
        radius < maxRadius;
        radius += spacing
      ) {
        ctx.beginPath();

        for (let i = 0; i <= 360; i++) {
          const angle = (i * Math.PI) / 180;
          const wobble = Math.sin(angle * 8) * 2;
          const r = radius + wobble;

          const x = centerX + Math.cos(angle) * r;
          const y = centerY + Math.sin(angle) * r;

          if (i === 0) {
            ctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
        }

        ctx.closePath();
        ctx.stroke();
      }

      // Tiny center of the web
      ctx.beginPath();
      ctx.arc(centerX, centerY, 4, 0, Math.PI * 2);
      ctx.fillStyle = "#00e5ff";
      ctx.fill();

      ctx.globalCompositeOperation = "source-over";
    }

    // Erase a circular area of the web
    function eraseWeb(x, y, radius = 35) {
      ctx.globalCompositeOperation = "destination-out";

      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.globalCompositeOperation = "source-over";
    }

    // Mouse movement clears the web without blocking website clicks
    document.addEventListener("mousemove", (event) => {
      eraseWeb(event.clientX, event.clientY, 32);
    });

    // Touch support for phones and tablets
    document.addEventListener(
      "touchmove",
      (event) => {
        for (const touch of event.touches) {
          eraseWeb(touch.clientX, touch.clientY, 40);
        }
      },
      { passive: true }
    );

    // Restore the complete web
    restoreButton.addEventListener("click", () => {
      drawWeb();
    });

    // Redraw when the browser window changes size
    window.addEventListener("resize", resizeCanvas);

    resizeCanvas();
  </script>

</body>
</html>
